name: Release

# Publishes the container image for a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Publishing is all this does. Deploying is a separate, manual workflow, so a
# tag can never put something into production by itself.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rankwarden

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per release: the version, which is what gets deployed, and the
      # commit, which says exactly what is inside it. Never `latest`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # See ci.yml for which token can read the private package.
          secrets: |
            npm_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
