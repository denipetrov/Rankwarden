# Local development stack. Auth is deliberately off so MONGODB_URI stays
# mongodb://localhost:27017 — do not reuse this file for anything deployed.
services:
  mongo:
    image: mongo:8
    container_name: rankwarden-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-rankwarden}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Browse the ingested leaderboards at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: rankwarden-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
